# dc-chat-v2：二代仿真预设的 Discord 版。
#
# 正文不单独维护：scripts/build-agent-preset-patches.mjs 从 base（qq-chat-v2）的
# agent.cordis.yml 生成本预设的 patch，按下面的规则改 persona.prefix，其余行（含安全守卫）原样沿用。
# 所以改二代提示词只改 qq-chat-v2，改完重跑 build-agent-preset-patches.mjs（或 setup-dsh）；
# 这里只记「Discord 版与 QQ 版哪里不一样」。
# 规则对不上（base 改了措辞、删了条目）时生成直接报错，不会悄悄产出改了一半的提示词。
base: qq-chat-v2

# 整条删除的编号条目（按【标题】认）；同一段里后面的条目自动重新编号。
# 这几个工具在 Discord 不注册（见 src/platform/capabilities.js），留着说明只会诱导模型去调。
removeItems:
  - 【合并转发】
  - 【拍一拍】
  - 【表情包】
  - 【偷图收藏】

# 逐字替换：from 必须在（删完条目后的）正文里恰好出现一次。
replace:
  - from: '改群名片'
    to: '改服务器昵称'
  - from: '引用、看图或收藏用消息的 messageId'
    to: '引用或看图用消息的 messageId'
  - from: '里的音频当**语音条**发出去'
    to: '里的音频当**音频文件**发出去'
  - from: '【聊天场景规则】'
    to: '【Discord 场景规则】'
  # 二代发言不经过 mdToPlain，Discord 会真的把 Markdown 渲染出来：理由要换，规则不变。
  - from: '不要使用 Markdown 格式（**、#、代码块在聊天里可能显示成乱码）'
    to: '不要用 Markdown 排版（Discord 会把 **、#、代码块渲染成格式，不像群友随手打的字）'
